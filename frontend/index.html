<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#153532">
  <title>Arus Kos | Keuangan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="auth-screen" id="auth-screen" aria-live="polite"></main>
  <div class="app-shell" id="app-shell" hidden>
    <aside class="sidebar" aria-label="Navigasi utama">
      <a class="brand" href="#dashboard" aria-label="Arus Kos, beranda">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 40 40" focusable="false"><path d="M5 18.5 20 6l15 12.5v15a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/><path d="M15 35V23h10v12M11 17h.01M29 17h.01"/></svg></span>
        <span class="brand-copy"><strong>arus kos</strong><small>KEUANGAN HARIAN</small></span>
      </a>
      <div class="nav-label">WORKSPACE</div>
      <nav class="primary-nav">
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon">◫</span>Ringkasan</button>
        <button class="nav-item" data-view="transactions"><span class="nav-icon">↕</span>Transaksi</button>
        <button class="nav-item" data-view="reports"><span class="nav-icon">▤</span>Laporan</button>
      </nav>
      <div class="nav-label records-label">DATA KOS</div>
      <nav class="primary-nav">
        <button class="nav-item" data-view="rooms"><span class="nav-icon">⌂</span>Kamar</button>
        <button class="nav-item" data-view="tenants"><span class="nav-icon">◎</span>Penghuni</button>
        <button class="nav-item" data-view="categories"><span class="nav-icon">▦</span>Operasional</button>
      </nav>
      <div class="sidebar-bottom">
        <span class="status-dot"></span>
        <span><strong>Data tersimpan</strong><small>Terhubung ke Supabase</small></span>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumb"><span>Arus Kos</span><span class="crumb-separator">/</span><strong id="page-crumb">Ringkasan</strong></div>
        <div class="topbar-right"><span class="today-label" id="today-label"></span><span class="avatar" id="user-avatar">AK</span><button class="button button-quiet button-small" data-action="logout">Keluar</button></div>
      </header>
      <section class="page-content" id="page-content" aria-live="polite">
        <div class="loading-state">Memuat data keuangan...</div>
      </section>
    </main>
  </div>

  <dialog class="editor-dialog" id="editor-dialog" aria-labelledby="dialog-title">
    <form id="record-form" method="dialog">
      <div class="dialog-heading">
        <div><span class="eyebrow" id="dialog-eyebrow">DATA KOS</span><h2 id="dialog-title">Tambah data</h2></div>
        <button class="icon-button" type="button" data-action="close-dialog" aria-label="Tutup">×</button>
      </div>
      <div class="form-fields" id="form-fields"></div>
      <p class="form-error" id="form-error" role="alert"></p>
      <div class="dialog-actions"><button class="button button-quiet" type="button" data-action="close-dialog">Batal</button><button class="button button-primary" type="submit"><span>Simpan data</span><span aria-hidden="true">↗</span></button></div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
